<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>WatchParty dev harness</title>
<link rel="stylesheet" href="../extension/content.css" />
<style>
  body { margin: 0; background: #000; color: #ddd; font: 14px system-ui, sans-serif; }
  .stage { padding: 24px; max-width: 900px; }
  video { width: 100%; max-width: 860px; background: #111; display: block; }
  .bar { display: flex; gap: 8px; margin: 12px 0; align-items: center; flex-wrap: wrap; }
  button { padding: 8px 12px; border-radius: 6px; border: 0; background: #6c5ce7; color: #fff; cursor: pointer; }
  input { padding: 8px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #fff; }
  pre { background: #111; padding: 10px; border-radius: 6px; max-height: 200px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<div class="stage">
  <h2>WatchParty dev harness</h2>
  <p>Stands in for a Hulu / Plex page. The real <code>content.js</code> runs against a shimmed <code>chrome</code> API.</p>
  <video id="v" controls muted playsinline preload="auto"></video>
  <div id="clipstatus">Generating a 20s test clip (canvas + tone) so no network is needed...</div>
  <div class="bar">
    <input id="nick" placeholder="name" value="Tester" />
    <button id="create">Create party</button>
    <input id="code" placeholder="CODE" maxlength="6" style="width:90px;text-transform:uppercase" />
    <button id="join">Join</button>
    <button id="status">Status</button>
    <button id="leave">Leave</button>
    <span id="out"></span>
  </div>
  <pre id="log"></pre>
</div>

<script>
  // Minimal chrome.* shim so content.js runs in a plain page. Storage is backed
  // by sessionStorage so settings and the remembered party survive a reload,
  // the way chrome.storage does for the real extension.
  const nickParam = new URLSearchParams(location.search).get("nick");
  const load = (k, d) => { try { return JSON.parse(sessionStorage.getItem(k)) || d; } catch { return d; } };
  const save = (k, v) => sessionStorage.setItem(k, JSON.stringify(v));
  const areas = {
    sync: load("wp-sync", { serverUrl: "ws://localhost:8080", nickname: "" }),
    local: load("wp-local", {}),
  };
  if (nickParam && !areas.sync.nickname) areas.sync.nickname = nickParam;
  const listeners = [];
  const changeListeners = [];
  const makeArea = (name) => ({
    get: async (keys) => {
      const ks = typeof keys === "string" ? [keys] : keys;
      const out = {};
      for (const k of ks) if (areas[name][k] !== undefined) out[k] = areas[name][k];
      return out;
    },
    set: async (obj) => {
      const changes = {};
      for (const [k, v] of Object.entries(obj)) { changes[k] = { oldValue: areas[name][k], newValue: v }; areas[name][k] = v; }
      save("wp-" + name, areas[name]);
      changeListeners.forEach((fn) => fn(changes, name));
    },
    remove: async (key) => { delete areas[name][key]; save("wp-" + name, areas[name]); },
  });
  window.chrome = {
    runtime: {
      onMessage: { addListener: (fn) => listeners.push(fn) },
      sendMessage: async (m) => (m?.type === "tabId" ? { tabId: 1 } : {}),
    },
    storage: { sync: makeArea("sync"), local: makeArea("local"), onChanged: { addListener: (fn) => changeListeners.push(fn) } },
  };
  window.wpStore = areas;
  // Send a message to the content script the way the popup would.
  window.sendToContent = (msg) =>
    new Promise((resolve) => listeners.forEach((fn) => fn(msg, {}, resolve)));

  const log = (t) => { const el = document.getElementById("log"); el.textContent += t + "\n"; el.scrollTop = el.scrollHeight; };
  const out = (o) => { document.getElementById("out").textContent = JSON.stringify(o); log(JSON.stringify(o)); };
  document.getElementById("create").onclick = async () =>
    out(await sendToContent({ type: "create", nickname: document.getElementById("nick").value }));
  document.getElementById("join").onclick = async () =>
    out(await sendToContent({ type: "join", code: document.getElementById("code").value.toUpperCase(), nickname: document.getElementById("nick").value }));
  document.getElementById("status").onclick = async () => out(await sendToContent({ type: "status" }));
  document.getElementById("leave").onclick = async () => out(await sendToContent({ type: "leave" }));
  const v = document.getElementById("v");
  ["play", "pause", "seeked"].forEach((e) => v.addEventListener(e, () => log(`video ${e} @ ${v.currentTime.toFixed(2)}`)));
</script>
<script>
  // Build a local test clip with both video and audio tracks. Chrome pauses
  // audio-less video in background tabs, so a real audio track matters.
  (async () => {
    const CLIP_SECONDS = 20;
    const canvas = document.createElement("canvas");
    canvas.width = 320; canvas.height = 180;
    const ctx = canvas.getContext("2d");
    const ac = new AudioContext();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    gain.gain.value = 0.02;
    const dest = ac.createMediaStreamDestination();
    osc.connect(gain).connect(dest);
    osc.start();
    const stream = new MediaStream([...canvas.captureStream(15).getVideoTracks(), ...dest.stream.getAudioTracks()]);
    const rec = new MediaRecorder(stream, { mimeType: "video/webm;codecs=vp8,opus" });
    const chunks = [];
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    const started = performance.now();
    const draw = () => {
      const t = (performance.now() - started) / 1000;
      ctx.fillStyle = `hsl(${(t * 30) % 360}, 60%, 30%)`;
      ctx.fillRect(0, 0, 320, 180);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 48px system-ui";
      ctx.fillText(t.toFixed(1) + "s", 90, 110);
      if (t < CLIP_SECONDS) requestAnimationFrame(draw);
    };
    draw();
    rec.start(500);
    await new Promise((r) => setTimeout(r, CLIP_SECONDS * 1000));
    rec.stop();
    await new Promise((r) => (rec.onstop = r));
    osc.stop(); ac.close();
    const blob = new Blob(chunks, { type: "video/webm" });
    const v = document.getElementById("v");
    v.src = URL.createObjectURL(blob);
    document.getElementById("clipstatus").textContent = "Test clip ready (" + Math.round(blob.size / 1024) + " KB).";
    window.clipReady = true;
  })();
</script>
<script src="../extension/config.js"></script>
<script src="../extension/content.js"></script>
</body>
</html>
