<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark; }
  body {
    width: 320px; margin: 0; padding: 16px;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #14151a; color: #e8e8ed;
  }
  h1 { font-size: 16px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: #e50914; box-shadow: 0 0 8px #e50914; }
  .sub { color: #9a9aa5; font-size: 12px; margin-bottom: 14px; }
  label { display: block; font-size: 12px; color: #9a9aa5; margin: 10px 0 4px; }
  input {
    width: 100%; box-sizing: border-box; padding: 9px 10px; border-radius: 8px; border: 1px solid #2c2d35;
    background: #1e1f26; color: #fff; font-size: 14px; outline: none;
  }
  input:focus { border-color: #6c5ce7; }
  input.code { text-transform: uppercase; letter-spacing: 3px; font-weight: 600; text-align: center; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1; padding: 10px; border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;
    background: #2c2d35; color: #fff;
  }
  button.primary { background: #6c5ce7; }
  button:hover { filter: brightness(1.12); }
  button:disabled { opacity: .5; cursor: default; }
  .party { display: none; }
  .party.active { display: block; }
  .setup.hidden { display: none; }
  .bigcode { font-size: 28px; letter-spacing: 6px; text-align: center; font-weight: 700; margin: 8px 0; color: #fff; }
  .link { font-size: 11px; word-break: break-all; color: #9a9aa5; background: #1e1f26; padding: 8px; border-radius: 6px; }
  .status { margin-top: 12px; padding: 10px; border-radius: 8px; background: #1e1f26; font-size: 12px; color: #c8c8d0; min-height: 18px; }
  .status.ok { border-left: 3px solid #2ecc71; }
  .status.err { border-left: 3px solid #e74c3c; }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: #9a9aa5; font-size: 12px; }
</style>
</head>
<body>
  <h1><span class="dot"></span> WatchParty</h1>
  <div class="sub">Sync Hulu &amp; Plex with friends</div>

  <div class="setup" id="setup">
    <label>Your name</label>
    <input id="nickname" placeholder="e.g. Sam" maxlength="32" />

    <div class="row">
      <button class="primary" id="create">Start a party</button>
    </div>

    <label>Or join with a code</label>
    <input id="code" class="code" placeholder="ABC123" maxlength="6" autocomplete="off" />
    <div class="row">
      <button id="join">Join party</button>
    </div>
  </div>

  <div class="party" id="party">
    <label>Party code</label>
    <div class="bigcode" id="bigcode">------</div>
    <div class="link" id="link"></div>
    <div class="row">
      <button class="primary" id="copy">Copy invite link</button>
      <button id="leave">Leave</button>
    </div>
  </div>

  <div class="status" id="status">Open a Hulu or Plex video, then start or join a party.</div>

  <details>
    <summary>Server settings</summary>
    <label>Relay server URL</label>
    <input id="serverUrl" placeholder="wss://your-relay.onrender.com" />
    <label>Access key (optional)</label>
    <input id="secret" placeholder="PARTY_SECRET from your relay" />
    <div class="row"><button id="saveServer">Save</button></div>
    <div class="sub" style="margin-top:8px">Friends never need this: invite links carry the server and key.</div>
  </details>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
