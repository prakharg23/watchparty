<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>WatchParty message box</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #16171d; }
  body {
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #ececf1;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    padding: 10px 14px 12px;
    height: 100%;
    box-sizing: border-box;
  }
  textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    height: 40px;
    padding: 9px 12px;
    border-radius: 12px;
    border: 1px solid #2c2d38;
    background: #1e1f27;
    color: #ececf1;
    font: inherit;
    outline: none;
    box-sizing: border-box;
  }
  textarea:focus { border-color: #6c5ce7; }
  textarea::placeholder { color: #9a9aa8; }
  button {
    flex: 0 0 40px;
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 12px;
    background: #6c5ce7;
    color: #fff;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }
  button:hover { filter: brightness(1.12); }
</style>
</head>
<body>
  <div class="wrap">
    <textarea id="box" rows="1" placeholder="Say something..." maxlength="1000"></textarea>
    <button id="send" title="Send">&#10148;</button>
  </div>
  <script src="compose.js"></script>
</body>
</html>
